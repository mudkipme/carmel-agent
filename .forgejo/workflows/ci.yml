name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  build-image:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      # The debian runner image has no Docker CLI; install the static client
      # (cached, keyed on the version) so login-action and build-push-action can
      # drive the host daemon (mounted via the runner's container.options).
      - name: Cache Docker CLI
        id: docker-cli
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/docker
          key: ${{ runner.os }}-docker-cli-29.5.3

      - name: Install Docker CLI
        if: steps.docker-cli.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.5.3.tgz \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker

      - uses: docker/setup-buildx-action@v4
        with:
          name: carmel-builder
          cleanup: false

      - uses: docker/login-action@v4
        with:
          registry: docker-registry.metagross.mudkip.me
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build carmel-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker-registry.metagross.mudkip.me/${{ github.repository }}:latest
            docker-registry.metagross.mudkip.me/${{ github.repository }}:${{ github.sha }}
          cache-from: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache,mode=max

      - name: Build sandbox runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: |
            docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:latest
            docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:${{ github.sha }}
          cache-from: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:buildcache
          cache-to: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:buildcache,mode=max

  build-image-tag:
    needs: [check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: debian
    steps:
      - uses: actions/checkout@v6

      - name: Cache Docker CLI
        id: docker-cli
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/docker
          key: ${{ runner.os }}-docker-cli-29.5.3

      - name: Install Docker CLI
        if: steps.docker-cli.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.5.3.tgz \
            | tar -xz -C /usr/local/bin --strip-components=1 docker/docker

      - uses: docker/setup-buildx-action@v4
        with:
          name: carmel-builder
          cleanup: false

      - uses: docker/login-action@v4
        with:
          registry: docker-registry.metagross.mudkip.me
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build carmel-agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker-registry.metagross.mudkip.me/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}:buildcache,mode=max

      - name: Build sandbox runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: |
            docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:${{ github.ref_name }}
          cache-from: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:buildcache
          cache-to: type=registry,ref=docker-registry.metagross.mudkip.me/${{ github.repository }}-runner:buildcache,mode=max
