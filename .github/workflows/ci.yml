name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g agent-browser@0.38.2
      - run: agent-browser install --with-deps
      - run: pnpm test:browser

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: carmel-agent:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Check server startup under a numeric UID
        run: |
          docker run -d --name carmel-server-ci --user 12345:12345 \
            --tmpfs /data:mode=1777 \
            -e CARMEL_HOST_UID=12345 -e CARMEL_HOST_GID=12345 \
            -e CARMEL_HOST_DATA_DIR=/tmp/carmel-server-ci \
            -e CARMEL_SECRET_KEY=disposable-ci-encryption-key \
            -p 127.0.0.1:8797:8797 carmel-agent:ci
          trap 'docker logs carmel-server-ci; docker rm -f carmel-server-ci' EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8797/api/auth/status > /tmp/carmel-status.json; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          node -e 'if (!JSON.parse(require("fs").readFileSync("/tmp/carmel-status.json")).needsSetup) process.exit(1)'
      - name: Build runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          load: true
          tags: carmel-agent-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      - name: Check runner identity and persistent package installs
        run: pnpm --filter @carmel-agent/server test:sandbox-identity
        env:
          CARMEL_SANDBOX_TEST_IMAGE: carmel-agent-runner:ci
          CARMEL_PODMAN_SOCKET: /var/run/docker.sock
      - name: Check sandbox browser and profile recovery
        run: pnpm --filter @carmel-agent/server test:browser-sandbox
        env:
          CARMEL_BROWSER_TEST_IMAGE: carmel-agent-runner:ci
          CARMEL_PODMAN_SOCKET: /var/run/docker.sock

  publish:
    needs: [check, browser, containers]
    if: >-
      github.repository == 'mudkipme/carmel-agent' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: Dockerfile
            image: ghcr.io/mudkipme/carmel-agent
            scope: server
          - file: Dockerfile.runner
            image: ghcr.io/mudkipme/carmel-agent-runner
            scope: runner
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.sha }}
            type=semver,pattern={{version}}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
