paths:
  /api/health:
    get:
      operationId: health
      tags:
        - Bootstrap
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
  /api/bootstrap:
    get:
      operationId: getBootstrap
      tags:
        - Bootstrap
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapPayload"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/oidc/login:
    get:
      operationId: startOidcLogin
      tags:
        - Auth
      security: []
      description: Browser navigation only. Redirects to the configured OpenID Connect provider and sets a short-lived flow cookie.
      responses:
        "302":
          description: Redirect to the provider
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/oidc/callback:
    get:
      operationId: completeOidcLogin
      tags:
        - Auth
      security: []
      description: Provider redirect target. Signs the browser in and redirects to /
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect into the app
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed-in bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapPayload"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/auth/setup:
    post:
      operationId: setup
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Initial bootstrap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapPayload"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/account:
    post:
      operationId: updateAccount
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRequest"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/users:
