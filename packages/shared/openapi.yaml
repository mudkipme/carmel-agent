      [{ $ref: "#/components/parameters/AgentID" }, { $ref: "#/components/parameters/IssueID" }]
    post:
      operationId: moveQueuedIssue
      tags: [Issues]
      description: Move a job up or down among this user's queued issues.
      requestBody:
        {
          required: true,
          content:
            {
              application/json: { schema: { $ref: "#/components/schemas/IssueQueueMoveRequest" } },
            },
        }
      responses:
        {
          "200":
            {
              description: Issue detail,
              content:
                { application/json: { schema: { $ref: "#/components/schemas/IssueDetail" } } },
            },
          "400": { $ref: "#/components/responses/Error" },
          "404": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
components:
  securitySchemes:
    carmelSession: { type: apiKey, in: cookie, name: carmel_session }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string } }
    AgentID: { name: agentId, in: path, required: true, schema: { type: string } }
    RunID: { name: runId, in: path, required: true, schema: { type: string } }
    TaskID: { name: taskId, in: path, required: true, schema: { type: string } }
    IssueID: { name: issueId, in: path, required: true, schema: { type: string } }
    SecretName: { name: name, in: path, required: true, schema: { type: string } }
    EntryID: { name: entryId, in: path, required: true, schema: { type: string } }
    ImageIndex:
      { name: imageIndex, in: path, required: true, schema: { type: integer, minimum: 0 } }
    PartIndex: { name: partIndex, in: path, required: true, schema: { type: integer, minimum: 0 } }
  responses:
    Error:
      {
        description: Error,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    JSONSuccess:
      {
        description: Success,
        content: { application/json: { schema: { $ref: "#/components/schemas/OK" } } },
      }
    ActiveRunConflict:
      {
        description: Resource is busy,
        headers: { x-agent-run-id: { schema: { type: string } } },
        content:
          {
            application/json:
              {
                schema:
                  {
                    allOf:
                      [
                        { $ref: "#/components/schemas/Error" },
                        { type: object, properties: { runId: { type: string } } },
                      ],
                  },
              },
          },
      }
    SafeEntryConflict:
      {
        description: Invalid cut point,
        content:
          {
            application/json:
              {
                schema:
                  {
                    allOf:
                      [
                        { $ref: "#/components/schemas/Error" },
                        { type: object, properties: { safeEntryId: { type: string } } },
                      ],
                  },
              },
          },
      }
    NDJSON:
      {
        description: Live sequence-enveloped run events,
        headers:
          {
            x-agent-run-id: { schema: { type: string } },
            x-agent-event-cursor: { schema: { type: integer } },
          },
        content: { application/x-ndjson: { schema: { type: string, format: binary } } },
      }
    Download:
      {
        description: File bytes or a zip archive,
        headers: { content-disposition: { schema: { type: string } } },
        content:
          {
            application/octet-stream: { schema: { type: string, format: binary } },
            application/zip: { schema: { type: string, format: binary } },
          },
      }
    Image:
      {
        description: Binary image,
        content:
          {
            image/png: { schema: { type: string, format: binary } },
            image/jpeg: { schema: { type: string, format: binary } },
            image/webp: { schema: { type: string, format: binary } },
          },
      }
  requestBodies:
    IssueRun:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/IssueRunRequest" } } },
      }
    IssueNote:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/IssueNoteRequest" } } },
      }
    Login:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } },
      }
    Setup:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/SetupRequest" } } },
      }
    Account:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/AccountRequest" } } },
      }
    CreateUser:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/CreateUserRequest" } } },
      }
    UserProfile:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [name],
                    properties: { name: { type: string }, fastTaskModelRefId: { type: string } },
                  },
              },
          },
      }
    UserRole:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [role],
                    properties: { role: { type: string, enum: [admin, user] } },
                  },
              },
          },
      }
    Password:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [password],
                    properties: { password: { type: string } },
                  },
              },
          },
      }
    Model:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelRequest" } } },
      }
    Provider:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/ProviderRequest" } } },
      }
    OAuthInput:
      {
        required: true,
        content:
          {
            application/json: { schema: { type: object, properties: { value: { type: string } } } },
          },
      }
    Agent:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentRequest" } } },
      }
    AgentRun:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/AgentRunRequest" } } },
      }
    SessionDraft:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/SessionDraftRequest" } } },
      }
    SessionPatch:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/SessionPatchRequest" } } },
      }
    OpenWebUIImport:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [agentId, modelRefId, source],
                    properties:
                      {
                        agentId: { type: string },
                        modelRefId: { type: string },
                        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" },
                        source: {},
                      },
                  },
              },
          },
      }
    Fork:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  { type: object, required: [entryId], properties: { entryId: { type: string } } },
              },
          },
      }
    Truncate:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [entryId],
                    properties:
                      {
                        entryId: { type: string },
                        thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" },
                      },
                  },
              },
          },
      }
    MessageEdit:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/MessageEditRequest" } } },
      }
    FileContent:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [path, content],
                    properties: { path: { type: string }, content: { type: string } },
                  },
              },
          },
      }
    FileCreate:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [path, type],
                    properties:
                      { path: { type: string }, type: { type: string, enum: [file, directory] } },
                  },
              },
          },
      }
    FileRename:
      {
        required: true,
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [path, newPath],
                    properties: { path: { type: string }, newPath: { type: string } },
                  },
              },
          },
      }
    FileUpload:
      {
        required: true,
        content: { application/octet-stream: { schema: { type: string, format: binary } } },
      }
    FileBatch:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/FileBatchRequest" } } },
      }
    AgentSecret:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/AgentSecretRequest" } } },
      }
    ApiKeyCreate:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreateRequest" } } },
      }
    TaskCreate:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskWrite" } } },
      }
    TaskPatch:
      {
        required: true,
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskWrite" } } },
      }
    IssueCreate:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/IssueCreateRequest" } } },
      }
    IssuePatch:
      {
        required: true,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/IssuePatchRequest" } } },
      }
  schemas:
    KnowledgeSettings:
      type: object
      properties:
        enabled:
          default: false
          type: boolean
        acceleration:
          default: auto
          type: string
          enum:
            - auto
            - cpu
            - vulkan
            - cuda
      required:
        - enabled
        - acceleration
      additionalProperties: false
    KnowledgeSourceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        path:
          type: string
          minLength: 1
          maxLength: 2000
        description:
          default: ""
          type: string
          maxLength: 1000
      required:
        - name
        - path
        - description
      additionalProperties: false
    KnowledgeSearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
        mode:
          default: fast
          type: string
          enum:
            - fast
            - semantic
            - deep
        sourceId:
          type: string
          maxLength: 100
        limit:
          default: 8
          type: integer
          minimum: 1
          maximum: 20
      required:
        - query
        - mode
        - limit
      additionalProperties: false
    KnowledgeReadRequest:
      type: object
      properties:
        sourceId:
          type: string
          minLength: 1
          maxLength: 100
        path:
          type: string
          minLength: 1
          maxLength: 2000
        fromLine:
          default: 1
          type: integer
          minimum: 1
          maximum: 1000000
        maxLines:
          default: 100
          type: integer
          minimum: 1
          maximum: 300
      required:
        - sourceId
        - path
        - fromLine
        - maxLines
      additionalProperties: false
    MemoryRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        expectedRevision:
          type: string
          maxLength: 100
      required:
        - title
        - content
      additionalProperties: false
    KnowledgeRefreshRequest:
      type: object
      properties:
        embed:
          default: false
          type: boolean
        allowDownloads:
          default: false
          type: boolean
        deep:
          default: false
          type: boolean
      required:
        - embed
        - allowDownloads
        - deep
      additionalProperties: false
    MemoryForgetRequest:
      type: object
      properties:
        expectedRevision:
          type: string
          minLength: 1
      required:
        - expectedRevision
      additionalProperties: false
    KnowledgeSource:
      type: object
      required:
        - id
        - agentId
        - name
        - path
        - description
        - createdAt
      properties:
        id: &a1
          type: string
        agentId: *a1
        name: *a1
        path: *a1
        description: *a1
        createdAt: &a2
          type: integer
    SavedMemory:
      type: object
      required:
        - id
        - agentId
        - title
        - content
        - revision
        - contributorId
        - createdAt
        - updatedAt
      properties:
        id: *a1
        agentId: *a1
        title: *a1
        content: *a1
        revision: *a1
        contributorId: *a1
        createdAt: *a2
        updatedAt: *a2
    KnowledgeDocument:
      type: object
      required:
        - sourceId
        - path
        - title
        - content
        - revision
        - fromLine
        - totalLines
        - citation
      properties:
        sourceId: *a1
        path: *a1
        title: *a1
        content: *a1
        revision: *a1
        fromLine: *a2
        totalLines: *a2
        citation: *a1
    KnowledgeHit:
      type: object
      required:
        - sourceId
        - path
        - title
        - revision
        - fromLine
        - totalLines
        - citation
        - excerpt
        - score
        - sourceName
      properties:
        sourceId: *a1
        path: *a1
        title: *a1
        revision: *a1
        fromLine: *a2
        totalLines: *a2
        citation: *a1
        excerpt: *a1
        score:
          type: number
        sourceName: *a1
    KnowledgeSearchResult:
      type: object
      required:
        - hits
        - mode
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeHit"
        mode:
          type: string
          enum:
            - fast
            - semantic
            - deep
        warning: *a1
    KnowledgeStatus:
      type: object
      required:
        - state
        - lastUpdatedAt
        - documents
        - needsEmbedding
        - error
        - backend
        - devices
      properties:
        state:
          type: string
          enum:
            - disabled
            - idle
            - updating
            - embedding
            - ready
            - error
        lastUpdatedAt:
          type: integer
          nullable: true
        documents: *a2
        needsEmbedding: *a2
        error: &a3
          type: string
          nullable: true
        backend: *a3
        devices:
          type: array
          items: *a1
    KnowledgeOverview:
      type: object
      required:
        - embeddingModel
        - settings
        - sources
        - status
        - memories
      properties:
        embeddingModel:
          type: string
        settings:
          $ref: "#/components/schemas/KnowledgeSettings"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSource"
        status:
          $ref: "#/components/schemas/KnowledgeStatus"
        memories:
          type: array
          items:
            $ref: "#/components/schemas/SavedMemory"
    Error: { type: object, required: [error], properties: { error: { type: string } } }
    OK: { type: object, required: [ok], properties: { ok: { type: boolean } } }
    SetupStatus:
      {
        type: object,
        required: [needsSetup, passwordLogin],
        properties:
          {
            needsSetup: { type: boolean },
            passwordLogin: { type: boolean },
            oidc:
              {
                type: object,
                required: [providerName],
                properties: { providerName: { type: string } },
              },
          },
      }
    ThinkingLevel: { type: string, enum: [off, minimal, low, medium, high, xhigh, max] }
    LoginRequest:
      {
        type: object,
        additionalProperties: false,
        properties: { username: { type: string }, password: { type: string } },
      }
    SetupRequest:
      {
        type: object,
        additionalProperties: false,
        required: [username, password],
        properties:
          {
            username: { type: string },
            password: { type: string },
            email: { type: string },
            name: { type: string },
          },
      }
    AccountRequest:
      {
        type: object,
        additionalProperties: false,
        required: [email],
        properties:
          {
            currentPassword: { type: string },
            email: { type: string },
            newPassword: { type: string },
          },
      }
    CreateUserRequest:
      {
        type: object,
        additionalProperties: false,
        required: [username, email, password],
        properties:
          {
            username: { type: string },
            email: { type: string },
            password: { type: string },
            name: { type: string },
            role: { type: string, enum: [admin, user] },
          },
      }
    User:
      {
        type: object,
        required: [id, name, email, role],
        properties:
          {
            id: { type: string },
            username: { type: string },
            name: { type: string },
            email: { type: string },
            role: { type: string, enum: [admin, user] },
            fastTaskModelRefId: { type: string },
            hasPassword: { type: boolean },
          },
      }
    ModelRequest:
      {
        type: object,
        required: [shared, label, provider, modelId],
        additionalProperties: false,
        properties:
          {
            shared: { type: boolean },
            label: { type: string },
            provider: { type: string },
            providerConfigId: { type: string },
            modelId: { type: string },
            api: { type: string },
            baseUrl: { type: string },
            contextWindow: { type: number },
            maxTokens: { type: number },
            reasoning: { type: boolean },
            input: { type: array, items: { type: string, enum: [text, image] } },
            thinkingLevelMap: { type: object, additionalProperties: true },
          },
      }
    ModelRef:
      {
        type: object,
        required: [id, ownerUserId, shared, label, provider, modelId],
        additionalProperties: false,
        properties:
          {
            id: { type: string },
            ownerUserId: { type: string },
            shared: { type: boolean },
            label: { type: string },
            provider: { type: string },
            providerConfigId: { type: string },
            modelId: { type: string },
            api: { type: string },
            baseUrl: { type: string },
            contextWindow: { type: number },
            maxTokens: { type: number },
            reasoning: { type: boolean },
            input: { type: array, items: { type: string, enum: [text, image] } },
            thinkingLevelMap: { type: object, additionalProperties: true },
          },
      }
    ProviderRequest:
      {
        type: object,
        required: [label, provider],
        additionalProperties: false,
        properties:
          {
            label: { type: string },
            provider: { type: string },
            authType: { type: string, enum: [api_key, oauth] },
            apiKey: { type: string },
            baseUrl: { type: string },
          },
      }
    ProviderConfig:
      {
        type: object,
        required: [id, userId, label, provider, createdAt, updatedAt],
        properties:
          {
            id: { type: string },
            userId: { type: string },
            label: { type: string },
            provider: { type: string },
            authType: { type: string },
            hasApiKey: { type: boolean },
            hasOAuth: { type: boolean },
            baseUrl: { type: string },
            createdAt: { type: number },
            updatedAt: { type: number },
          },
      }
    ProviderModel:
      {
        type: object,
        required: [id, name],
        additionalProperties: true,
        properties: { id: { type: string }, name: { type: string } },
      }
    OAuthFlow:
      {
        type: object,
        required: [id, providerConfigId, provider, providerName, status],
        additionalProperties: true,
        properties:
          {
            id: { type: string },
            providerConfigId: { type: string },
            provider: { type: string },
            providerName: { type: string },
            status: { type: string, enum: [pending, auth, input, success, error] },
          },
      }
    McpServer:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, transport, url]
          properties:
            id: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
            transport: { type: string, enum: [http] }
            enabled: { type: boolean, default: true }
            timeoutMs: { type: integer, minimum: 1000, maximum: 300000, default: 60000 }
            tools: { type: array, items: { type: string, minLength: 1 } }
            url: { type: string, description: "HTTP(S) URL without embedded credentials." }
            headers: { type: object, additionalProperties: { type: string }, default: {} }
        - type: object
          additionalProperties: false
          required: [id, transport, command]
          properties:
            id: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
            transport: { type: string, enum: [stdio] }
            enabled: { type: boolean, default: true }
            timeoutMs: { type: integer, minimum: 1000, maximum: 300000, default: 60000 }
            tools: { type: array, items: { type: string, minLength: 1 } }
            command: { type: string, minLength: 1 }
            args: { type: array, items: { type: string }, default: [] }
            env: { type: object, additionalProperties: { type: string }, default: {} }
    AgentRequest:
      {
        type: object,
        required:
          [
            shared,
            name,
            description,
            workingDirMode,
            workingDir,
            mounts,
            systemPrompt,
            promptTemplates,
            permissions,
            defaultModelRefId,
            defaultThinkingLevel,
          ],
        additionalProperties: false,
        properties:
          {
            shared: { type: boolean },
            name: { type: string },
            description: { type: string },
            workingDirMode: { type: string, enum: [default, manual] },
            workingDir: { type: string },
            defaultWorkingDir: { type: string },
            mounts: { type: array, items: { type: object, additionalProperties: true } },
            systemPrompt: { type: string },
            promptTemplates: { type: array, items: { type: object, additionalProperties: true } },
            permissions: { type: object, additionalProperties: { type: boolean } },
            codemodeEnabled: { type: boolean, default: false },
            defaultModelRefId: { type: string },
            mcpServers:
              { type: array, maxItems: 20, items: { $ref: "#/components/schemas/McpServer" } },
            defaultThinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" },
          },
      }
    AgentConfig:
      {
        type: object,
        required:
          [
            id,
            ownerUserId,
            shared,
            name,
            description,
            workingDirMode,
            workingDir,
            mounts,
            systemPrompt,
            promptTemplates,
            permissions,
            defaultModelRefId,
            defaultThinkingLevel,
            createdAt,
            updatedAt,
          ],
        additionalProperties: false,
        properties:
          {
            id: { type: string },
            ownerUserId: { type: string },
            shared: { type: boolean },
            name: { type: string },
            description: { type: string },
            workingDirMode: { type: string, enum: [default, manual] },
            workingDir: { type: string },
            defaultWorkingDir: { type: string },
            mounts: { type: array, items: { type: object, additionalProperties: true } },
            systemPrompt: { type: string },
            promptTemplates: { type: array, items: { type: object, additionalProperties: true } },
            permissions: { type: object, additionalProperties: { type: boolean } },
            codemodeEnabled: { type: boolean, default: false },
            defaultModelRefId: { type: string },
            mcpServers:
              { type: array, maxItems: 20, items: { $ref: "#/components/schemas/McpServer" } },
            defaultThinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" },
            createdAt: { type: number },
            updatedAt: { type: number },
          },
      }
    AgentRunRequest:
      {
        type: object,
        additionalProperties: false,
        properties:
          {
            sessionId: { type: string },
            modelRefId: { type: string },
            thinkingLevel: { $ref: "#/components/schemas/ThinkingLevel" },
            promptInput:
              {
                type: object,
                required: [text],
                properties:
                  {
                    text: { type: string },
                    images:
                      {
                        type: array,
                        maxItems: 10,
                        items:
                          {
                            type: object,
                            required: [type, data, mimeType],
