                  type: array
                  items:
                    type: object
                    properties: {}
                compactionFailure:
                  type: object
                  properties: {}
                runFailure:
                  type: object
                  properties: {}
              description: Pi Durable live state (`pi.live`). Clients render generation.message as the streaming reply, tools as the current round's tool calls, and nestedTools as calls made by running tools.
            errorMessage:
