openapi: 3.0.3
info:
  title: Carmel Agent API
  version: 1.0.0
  description: Authoritative HTTP contract for native and web Carmel Agent clients. Streams are NDJSON, never SSE.
servers:
  - url: /
security:
  - carmelSession: []
tags:
  - { name: Auth }
  - { name: Bootstrap }
  - { name: Users }
  - { name: Models }
  - { name: Providers }
  - { name: Agents }
  - { name: Runs }
  - { name: Sessions }
  - { name: Files }
  - { name: Tasks }
  - { name: Issues }
  - { name: Knowledge }
paths:
  /api/agents/{agentId}/knowledge:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      operationId: getKnowledge
      tags:
        - Knowledge
      responses:
        "200":
          description: getKnowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeOverview"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/settings:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      operationId: getKnowledgeSettings
      tags:
        - Knowledge
      summary: Read the agent's knowledge settings
      description: Available to users who can access the agent when its read permission is enabled. Returns settings without loading memories or starting a knowledge worker.
      responses:
        "200":
          description: Current knowledge settings, including defaults when not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSettings"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveKnowledgeSettings
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSettings"
      responses:
        "200":
          description: saveKnowledgeSettings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSettings"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/sources:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: addKnowledgeSource
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSourceRequest"
      responses:
        "201":
          description: addKnowledgeSource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
      - name: sourceId
        in: path
        required: true
        schema: &a1
          type: string
    delete:
      operationId: disconnectKnowledgeSource
      tags:
        - Knowledge
      responses:
        "200":
          description: disconnectKnowledgeSource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/search:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: searchKnowledge
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
      responses:
        "200":
          description: searchKnowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResult"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/read:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: readKnowledge
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeReadRequest"
      responses:
        "200":
          description: readKnowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/refresh:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: refreshKnowledge
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeRefreshRequest"
      responses:
        "202":
          description: refreshKnowledge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/memories:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      operationId: saveMemory
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRequest"
      responses:
        "201":
          description: saveMemory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMemory"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/agents/{agentId}/knowledge/memories/{memoryId}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
      - name: memoryId
        in: path
        required: true
        schema: *a1
    put:
      operationId: editMemory
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRequest"
      responses:
        "200":
          description: editMemory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMemory"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    delete:
      operationId: forgetMemory
      tags:
        - Knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryForgetRequest"
      responses:
        "200":
          description: forgetMemory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/health:
    get:
      {
        operationId: health,
        tags: [Bootstrap],
        responses: { "200": { $ref: "#/components/responses/JSONSuccess" } },
      }
  /api/bootstrap:
    get:
      {
        operationId: getBootstrap,
        tags: [Bootstrap],
        responses:
          {
            "200":
              {
                description: Bootstrap state,
                content:
                  {
                    application/json: { schema: { $ref: "#/components/schemas/BootstrapPayload" } },
                  },
              },
            "401": { $ref: "#/components/responses/Error" },
          },
      }
  /api/auth/status:
    get:
      {
        operationId: getAuthStatus,
        tags: [Auth],
        security: [],
        responses:
          {
            "200":
              {
                description: Setup state,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/SetupStatus" } } },
              },
          },
      }
  /api/auth/login:
    post:
      {
        operationId: login,
        tags: [Auth],
        security: [],
        requestBody: { $ref: "#/components/requestBodies/Login" },
        responses:
          {
            "200":
              {
                description: Signed-in bootstrap,
                content:
                  {
                    application/json: { schema: { $ref: "#/components/schemas/BootstrapPayload" } },
                  },
              },
            "401": { $ref: "#/components/responses/Error" },
            "429": { $ref: "#/components/responses/Error" },
          },
      }
  /api/auth/logout:
    post:
      {
        operationId: logout,
        tags: [Auth],
        security: [],
        responses: { "200": { $ref: "#/components/responses/JSONSuccess" } },
      }
  /api/auth/setup:
    post:
      {
        operationId: setup,
        tags: [Auth],
        security: [],
        requestBody: { $ref: "#/components/requestBodies/Setup" },
        responses:
          {
            "201":
              {
                description: Initial bootstrap,
                content:
                  {
                    application/json: { schema: { $ref: "#/components/schemas/BootstrapPayload" } },
                  },
              },
            "400": { $ref: "#/components/responses/Error" },
          },
      }
  /api/auth/oidc/login:
    get:
      {
        operationId: startOidcLogin,
        tags: [Auth],
        security: [],
        description: Browser navigation only. Redirects to the configured OpenID Connect provider and sets a short-lived flow cookie.,
        responses:
          {
            "302":
              {
                description: Redirect to the provider,
                or back to /?auth_error=<code> if it cannot be reached,
              },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
  /api/auth/oidc/callback:
    get:
      {
        operationId: completeOidcLogin,
        tags: [Auth],
        security: [],
        description: Provider redirect target. Signs the browser in and redirects to /,
        or to /?auth_error=<code> when sign-in is refused.,
        parameters:
          [
            { name: code, in: query, schema: { type: string } },
            { name: state, in: query, schema: { type: string } },
          ],
        responses:
          {
            "302": { description: Redirect into the app },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
  /api/auth/account:
    post:
      {
        operationId: updateAccount,
        tags: [Auth],
        requestBody: { $ref: "#/components/requestBodies/Account" },
        responses:
          {
            "200":
              {
                description: User,
                content: { application/json: { schema: { $ref: "#/components/schemas/User" } } },
              },
            "400": { $ref: "#/components/responses/Error" },
          },
      }
  /api/users:
    get:
      {
        operationId: listUsers,
        tags: [Users],
        responses:
          {
            "200":
              {
                description: Users,
                content:
                  {
                    application/json:
                      { schema: { type: array, items: { $ref: "#/components/schemas/User" } } },
                  },
              },
          },
      }
    post:
      {
        operationId: createUser,
        tags: [Users],
        requestBody: { $ref: "#/components/requestBodies/CreateUser" },
        responses:
          {
            "201":
              {
                description: User,
                content: { application/json: { schema: { $ref: "#/components/schemas/User" } } },
              },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /api/users/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      {
        operationId: updateUserProfile,
        tags: [Users],
        requestBody: { $ref: "#/components/requestBodies/UserProfile" },
        responses:
          {
            "200":
              {
                description: User,
                content: { application/json: { schema: { $ref: "#/components/schemas/User" } } },
              },
          },
      }
    patch:
      {
        operationId: updateUserRole,
        tags: [Users],
        requestBody: { $ref: "#/components/requestBodies/UserRole" },
        responses:
          {
            "200":
              {
                description: User,
                content: { application/json: { schema: { $ref: "#/components/schemas/User" } } },
              },
          },
      }
    delete:
      {
        operationId: deleteUser,
        tags: [Users],
        responses:
          {
            "200": { $ref: "#/components/responses/JSONSuccess" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /api/users/{id}/password:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      {
        operationId: resetUserPassword,
        tags: [Users],
        requestBody: { $ref: "#/components/requestBodies/Password" },
        responses: { "200": { $ref: "#/components/responses/JSONSuccess" } },
      }
  /api/api-keys:
    get:
      {
        operationId: listApiKeys,
        tags: [Users],
        description: Keys for the OpenAI-compatible /v1 API. Never includes the key itself.,
        responses:
          {
            "200":
              {
                description: API keys,
                content:
                  {
                    application/json:
                      { schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } },
                  },
              },
          },
      }
    post:
      {
        operationId: createApiKey,
        tags: [Users],
        description: The only response that carries the key; it cannot be read back later.,
        requestBody: { $ref: "#/components/requestBodies/ApiKeyCreate" },
        responses:
          {
            "201":
              {
                description: Created key,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreated" } } },
              },
            "400": { $ref: "#/components/responses/Error" },
          },
      }
  /api/api-keys/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    delete:
      {
        operationId: deleteApiKey,
        tags: [Users],
        responses:
          {
            "200": { $ref: "#/components/responses/JSONSuccess" },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
  /api/models/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      {
        operationId: upsertModel,
        tags: [Models],
        requestBody: { $ref: "#/components/requestBodies/Model" },
        responses:
          {
            "200":
              {
                description: Model,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/ModelRef" } } },
              },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
    delete:
      {
        operationId: deleteModel,
        tags: [Models],
        responses:
          {
            "200":
              {
                description: Replacement bootstrap,
                content:
                  {
                    application/json: { schema: { $ref: "#/components/schemas/BootstrapPayload" } },
                  },
              },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /api/provider-configs/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      {
        operationId: upsertProviderConfig,
        tags: [Providers],
        requestBody: { $ref: "#/components/requestBodies/Provider" },
        responses:
          {
            "200":
              {
                description: Provider,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/ProviderConfig" } } },
              },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
    delete:
      {
        operationId: deleteProviderConfig,
        tags: [Providers],
        responses:
          {
            "200":
              {
                description: Replacement bootstrap,
                content:
                  {
                    application/json: { schema: { $ref: "#/components/schemas/BootstrapPayload" } },
                  },
              },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /api/provider-configs/{id}/models:
    parameters:
      [
        { $ref: "#/components/parameters/ID" },
        { name: refresh, in: query, schema: { type: boolean } },
      ]
    get:
      {
        operationId: listProviderModels,
        tags: [Providers],
        responses:
          {
            "200":
              {
                description: Models,
                content:
                  {
                    application/json:
                      {
                        schema:
                          { type: array, items: { $ref: "#/components/schemas/ProviderModel" } },
                      },
                  },
              },
          },
      }
  /api/oauth/providers:
    get:
      {
        operationId: listOAuthProviders,
        tags: [Providers],
        responses:
          {
            "200":
              {
                description: OAuth providers,
                content:
                  {
                    application/json:
                      {
                        schema:
                          { type: array, items: { type: object, additionalProperties: true } },
                      },
                  },
              },
          },
      }
  /api/provider-configs/{id}/oauth/login:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      {
        operationId: startProviderOAuth,
        tags: [Providers],
        responses:
          {
            "200":
              {
                description: OAuth flow,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/OAuthFlow" } } },
              },
          },
      }
  /api/oauth/flows/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      {
        operationId: getOAuthFlow,
        tags: [Providers],
        responses:
          {
            "200":
              {
                description: OAuth flow,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/OAuthFlow" } } },
              },
          },
      }
  /api/oauth/flows/{id}/input:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      {
        operationId: submitOAuthInput,
        tags: [Providers],
        requestBody: { $ref: "#/components/requestBodies/OAuthInput" },
        responses:
          {
            "200":
              {
                description: OAuth flow,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/OAuthFlow" } } },
              },
          },
      }
  /api/agents/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    put:
      {
        operationId: upsertAgent,
        tags: [Agents],
        requestBody: { $ref: "#/components/requestBodies/Agent" },
        responses:
          {
            "200":
              {
                description: Redacted agent,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/AgentConfig" } } },
              },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
    delete:
      {
        operationId: deleteAgent,
        tags: [Agents],
        responses:
          {
            "200": { $ref: "#/components/responses/JSONSuccess" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /api/agents/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      {
        operationId: getAgentSettings,
        tags: [Agents],
        responses:
          {
            "200":
              {
                description: Owner settings,
                content:
                  { application/json: { schema: { $ref: "#/components/schemas/AgentConfig" } } },
              },
          },
      }
  /api/agents/{id}/mcp/test:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      {
        operationId: testAgentMcpServer,
        tags: [Agents],
        requestBody:
          {
            required: true,
            content: { application/json: { schema: { $ref: "#/components/schemas/McpServer" } } },
          },
        responses:
          {
            "200":
              {
                description: Discovered MCP tools,
                content:
                  {
                    application/json:
                      {
                        schema:
                          {
                            type: object,
                            required: [tools],
                            properties:
                              {
                                tools:
                                  {
                                    type: array,
                                    items:
                                      {
                                        type: object,
                                        required: [name, label],
                                        properties:
                                          { name: { type: string }, label: { type: string } },
                                      },
                                  },
                              },
                          },
                      },
                  },
              },
            "400": { $ref: "#/components/responses/Error" },
            "403": { $ref: "#/components/responses/Error" },
            "409": { $ref: "#/components/responses/ActiveRunConflict" },
          },
      }
  /api/agents/{id}/commands:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      {
        operationId: getAgentCommands,
        tags: [Agents],
        responses:
          {
            "200":
              {
                description: Commands,
                content:
                  { application/json: { schema: { type: object, additionalProperties: true } } },
              },
          },
      }
  /api/agents/{id}/run:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      {
        operationId: startAgentRun,
        tags: [Runs],
        requestBody: { $ref: "#/components/requestBodies/AgentRun" },
        responses:
          {
            "200": { $ref: "#/components/responses/NDJSON" },
            "409": { $ref: "#/components/responses/ActiveRunConflict" },
          },
      }
  /api/agent-runs/{runId}/events:
    parameters:
      [
        { $ref: "#/components/parameters/RunID" },
        { name: after, in: query, required: true, schema: { type: integer, minimum: 0 } },
      ]
    get:
      {
        operationId: watchAgentRun,
        tags: [Runs],
        responses:
          {
            "200": { $ref: "#/components/responses/NDJSON" },
            "400": { $ref: "#/components/responses/Error" },
            "404": { $ref: "#/components/responses/Error" },
            "409": { $ref: "#/components/responses/Error" },
          },
      }
  /api/agent-runs/{runId}/abort:
    parameters: [{ $ref: "#/components/parameters/RunID" }]
    post:
      {
        operationId: abortAgentRun,
        tags: [Runs],
        responses:
          {
            "200": { $ref: "#/components/responses/JSONSuccess" },
            "404": { $ref: "#/components/responses/Error" },
          },
      }
  /api/sessions:
    post:
      {
        operationId: createSession,
        tags: [Sessions],
        requestBody: { $ref: "#/components/requestBodies/SessionDraft" },
        responses:
          {
            "201":
              {
                description: Session,
                content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } },
              },
          },
      }
  /api/agents/{agentId}/archived-sessions:
