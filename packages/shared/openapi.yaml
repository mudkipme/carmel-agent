openapi: 3.0.3
info:
  title: Carmel Agent API
  version: 1.0.0
  description: Authoritative HTTP contract for native and web Carmel Agent clients. Streams are NDJSON, never SSE.
servers:
  - url: /
security:
  - carmelSession: []
tags:
  - {name: Auth}
  - {name: Bootstrap}
  - {name: Users}
  - {name: Models}
  - {name: Providers}
  - {name: Agents}
  - {name: Runs}
  - {name: Sessions}
  - {name: Files}
  - {name: Tasks}
  - {name: Issues}
paths:
  /api/health:
    get: {operationId: health, tags: [Bootstrap], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}}}
  /api/bootstrap:
    get: {operationId: getBootstrap, tags: [Bootstrap], responses: {'200': {description: Bootstrap state, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapPayload'}}}}, '401': {$ref: '#/components/responses/Error'}}}
  /api/auth/status:
    get: {operationId: getAuthStatus, tags: [Auth], security: [], responses: {'200': {description: Setup state, content: {application/json: {schema: {$ref: '#/components/schemas/SetupStatus'}}}}}}
  /api/auth/login:
    post: {operationId: login, tags: [Auth], security: [], requestBody: {$ref: '#/components/requestBodies/Login'}, responses: {'200': {description: Signed-in bootstrap, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapPayload'}}}}, '401': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}}
  /api/auth/logout:
    post: {operationId: logout, tags: [Auth], security: [], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}}}
  /api/auth/setup:
    post: {operationId: setup, tags: [Auth], security: [], requestBody: {$ref: '#/components/requestBodies/Setup'}, responses: {'201': {description: Initial bootstrap, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapPayload'}}}}, '400': {$ref: '#/components/responses/Error'}}}
  /api/auth/oidc/login:
    get: {operationId: startOidcLogin, tags: [Auth], security: [], description: Browser navigation only. Redirects to the configured OpenID Connect provider and sets a short-lived flow cookie., responses: {'302': {description: Redirect to the provider, or back to /?auth_error=<code> if it cannot be reached}, '404': {$ref: '#/components/responses/Error'}}}
  /api/auth/oidc/callback:
    get: {operationId: completeOidcLogin, tags: [Auth], security: [], description: Provider redirect target. Signs the browser in and redirects to /, or to /?auth_error=<code> when sign-in is refused., parameters: [{name: code, in: query, schema: {type: string}}, {name: state, in: query, schema: {type: string}}], responses: {'302': {description: Redirect into the app}, '404': {$ref: '#/components/responses/Error'}}}
  /api/auth/account:
    post: {operationId: updateAccount, tags: [Auth], requestBody: {$ref: '#/components/requestBodies/Account'}, responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '400': {$ref: '#/components/responses/Error'}}}
  /api/users:
    get: {operationId: listUsers, tags: [Users], responses: {'200': {description: Users, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/User'}}}}}}}
    post: {operationId: createUser, tags: [Users], requestBody: {$ref: '#/components/requestBodies/CreateUser'}, responses: {'201': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}, '409': {$ref: '#/components/responses/Error'}}}
  /api/users/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: updateUserProfile, tags: [Users], requestBody: {$ref: '#/components/requestBodies/UserProfile'}, responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}}}
    patch: {operationId: updateUserRole, tags: [Users], requestBody: {$ref: '#/components/requestBodies/UserRole'}, responses: {'200': {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}}}
    delete: {operationId: deleteUser, tags: [Users], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/users/{id}/password:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: resetUserPassword, tags: [Users], requestBody: {$ref: '#/components/requestBodies/Password'}, responses: {'200': {$ref: '#/components/responses/JSONSuccess'}}}
  /api/api-keys:
    get: {operationId: listApiKeys, tags: [Users], description: Keys for the OpenAI-compatible /v1 API. Never includes the key itself., responses: {'200': {description: API keys, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ApiKey'}}}}}}}
    post: {operationId: createApiKey, tags: [Users], description: The only response that carries the key; it cannot be read back later., requestBody: {$ref: '#/components/requestBodies/ApiKeyCreate'}, responses: {'201': {description: Created key, content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyCreated'}}}}, '400': {$ref: '#/components/responses/Error'}}}
  /api/api-keys/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete: {operationId: deleteApiKey, tags: [Users], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/models/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: upsertModel, tags: [Models], requestBody: {$ref: '#/components/requestBodies/Model'}, responses: {'200': {description: Model, content: {application/json: {schema: {$ref: '#/components/schemas/ModelRef'}}}}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteModel, tags: [Models], responses: {'200': {description: Replacement bootstrap, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapPayload'}}}}, '409': {$ref: '#/components/responses/Error'}}}
  /api/provider-configs/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: upsertProviderConfig, tags: [Providers], requestBody: {$ref: '#/components/requestBodies/Provider'}, responses: {'200': {description: Provider, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderConfig'}}}}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteProviderConfig, tags: [Providers], responses: {'200': {description: Replacement bootstrap, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapPayload'}}}}, '409': {$ref: '#/components/responses/Error'}}}
  /api/provider-configs/{id}/models:
    parameters: [{$ref: '#/components/parameters/ID'}, {name: refresh, in: query, schema: {type: boolean}}]
    get: {operationId: listProviderModels, tags: [Providers], responses: {'200': {description: Models, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProviderModel'}}}}}}}
  /api/oauth/providers:
    get: {operationId: listOAuthProviders, tags: [Providers], responses: {'200': {description: OAuth providers, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}}}
  /api/provider-configs/{id}/oauth/login:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: startProviderOAuth, tags: [Providers], responses: {'200': {description: OAuth flow, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthFlow'}}}}}}
  /api/oauth/flows/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getOAuthFlow, tags: [Providers], responses: {'200': {description: OAuth flow, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthFlow'}}}}}}
  /api/oauth/flows/{id}/input:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: submitOAuthInput, tags: [Providers], requestBody: {$ref: '#/components/requestBodies/OAuthInput'}, responses: {'200': {description: OAuth flow, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthFlow'}}}}}}
  /api/agents/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: upsertAgent, tags: [Agents], requestBody: {$ref: '#/components/requestBodies/Agent'}, responses: {'200': {description: Redacted agent, content: {application/json: {schema: {$ref: '#/components/schemas/AgentConfig'}}}}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteAgent, tags: [Agents], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/agents/{id}/settings:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getAgentSettings, tags: [Agents], responses: {'200': {description: Owner settings, content: {application/json: {schema: {$ref: '#/components/schemas/AgentConfig'}}}}}}
  /api/agents/{id}/commands:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getAgentCommands, tags: [Agents], responses: {'200': {description: Commands, content: {application/json: {schema: {type: object, additionalProperties: true}}}}}}
  /api/extensions:
    get: {operationId: listExtensions, tags: [Agents], responses: {'200': {description: Extensions, content: {application/json: {schema: {type: object, additionalProperties: true}}}}}}
  /api/agents/{id}/run:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: startAgentRun, tags: [Runs], requestBody: {$ref: '#/components/requestBodies/AgentRun'}, responses: {'200': {$ref: '#/components/responses/NDJSON'}, '409': {$ref: '#/components/responses/ActiveRunConflict'}}}
  /api/agent-runs/{runId}/events:
    parameters: [{$ref: '#/components/parameters/RunID'}, {name: after, in: query, required: true, schema: {type: integer, minimum: 0}}]
    get: {operationId: watchAgentRun, tags: [Runs], responses: {'200': {$ref: '#/components/responses/NDJSON'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/agent-runs/{runId}/abort:
    parameters: [{$ref: '#/components/parameters/RunID'}]
    post: {operationId: abortAgentRun, tags: [Runs], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/sessions:
    post: {operationId: createSession, tags: [Sessions], requestBody: {$ref: '#/components/requestBodies/SessionDraft'}, responses: {'201': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}}}
  /api/agents/{agentId}/archived-sessions:
    parameters: [{$ref: '#/components/parameters/AgentID'}]
    get: {operationId: listArchivedSessions, tags: [Sessions], responses: {'200': {description: Archived sessions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SessionMetadata'}}}}}, '404': {$ref: '#/components/responses/Error'}}}
  /api/sessions/import/open-webui:
    post: {operationId: importOpenWebUISessions, tags: [Sessions], requestBody: {$ref: '#/components/requestBodies/OpenWebUIImport'}, responses: {'201': {description: Import result, content: {application/json: {schema: {type: object, additionalProperties: true}}}}}}
  /api/sessions/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch: {operationId: patchSession, tags: [Sessions], requestBody: {$ref: '#/components/requestBodies/SessionPatch'}, responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {$ref: '#/components/responses/ActiveRunConflict'}}}
    delete: {operationId: deleteSession, tags: [Sessions], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '409': {$ref: '#/components/responses/ActiveRunConflict'}}}
  /api/sessions/{id}/connection:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getSessionConnection, tags: [Sessions], responses: {'200': {description: Transcript and active run, content: {application/json: {schema: {$ref: '#/components/schemas/SessionConnection'}}}}}}
  /api/sessions/{id}/fork:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: forkSession, tags: [Sessions], requestBody: {$ref: '#/components/requestBodies/Fork'}, responses: {'201': {description: Forked session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {$ref: '#/components/responses/SafeEntryConflict'}}}
  /api/sessions/{id}/messages/truncate:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: truncateSession, tags: [Sessions], requestBody: {$ref: '#/components/requestBodies/Truncate'}, responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '409': {$ref: '#/components/responses/SafeEntryConflict'}}}
  /api/sessions/{id}/messages/{entryId}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/EntryID'}]
    patch: {operationId: editSessionMessage, tags: [Sessions], requestBody: {$ref: '#/components/requestBodies/MessageEdit'}, responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}}}
  /api/sessions/{id}/images/{entryId}/{imageIndex}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/ImageIndex'}]
    get: {operationId: getSessionImage, tags: [Sessions], responses: {'200': {$ref: '#/components/responses/Image'}}}
  /api/sessions/{id}/tool-result-images/{entryId}/{partIndex}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/PartIndex'}]
    get: {operationId: getToolResultImage, tags: [Sessions], responses: {'200': {$ref: '#/components/responses/Image'}}}
  /api/sessions/{id}/attachments/{entryId}/{attachmentId}:
    parameters: [{$ref: '#/components/parameters/ID'}, {$ref: '#/components/parameters/EntryID'}, {$ref: '#/components/parameters/AttachmentID'}]
    get: {operationId: getSessionAttachment, tags: [Sessions], responses: {'200': {$ref: '#/components/responses/Image'}}}
  /api/agents/{id}/files:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: listAgentFiles, tags: [Files], parameters: [{name: path, in: query, schema: {type: string}}, {name: showHidden, in: query, schema: {type: boolean}}], responses: {'200': {description: Files, content: {application/json: {schema: {$ref: '#/components/schemas/FileList'}}}}}}
    post: {operationId: createAgentFile, tags: [Files], requestBody: {$ref: '#/components/requestBodies/FileCreate'}, responses: {'201': {description: Entry, content: {application/json: {schema: {$ref: '#/components/schemas/FileEntry'}}}}}}
    patch: {operationId: renameAgentFile, tags: [Files], requestBody: {$ref: '#/components/requestBodies/FileRename'}, responses: {'200': {description: Entry, content: {application/json: {schema: {$ref: '#/components/schemas/FileEntry'}}}}}}
    delete: {operationId: deleteAgentFile, tags: [Files], parameters: [{name: path, in: query, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}}}
  /api/agents/{id}/files/content:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getAgentFileContent, tags: [Files], parameters: [{name: path, in: query, required: true, schema: {type: string}}], responses: {'200': {description: Content, content: {application/json: {schema: {$ref: '#/components/schemas/FileContent'}}}}}}
    put: {operationId: putAgentFileContent, tags: [Files], requestBody: {$ref: '#/components/requestBodies/FileContent'}, responses: {'200': {description: Content, content: {application/json: {schema: {$ref: '#/components/schemas/FileContent'}}}}}}
  /api/agents/{id}/files/raw:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: getAgentFileImage, tags: [Files], parameters: [{name: path, in: query, required: true, schema: {type: string}}], responses: {'200': {$ref: '#/components/responses/Image'}}}
  /api/agents/{id}/files/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get: {operationId: downloadAgentFiles, tags: [Files], description: One file streams as-is; a directory or several paths stream as a zip archive., parameters: [{name: path, in: query, required: true, explode: true, schema: {type: array, items: {type: string}}}], responses: {'200': {$ref: '#/components/responses/Download'}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/agents/{id}/files/upload:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put: {operationId: uploadAgentFile, tags: [Files], parameters: [{name: path, in: query, required: true, schema: {type: string}}, {name: overwrite, in: query, schema: {type: boolean}}], requestBody: {$ref: '#/components/requestBodies/FileUpload'}, responses: {'201': {description: Entry, content: {application/json: {schema: {$ref: '#/components/schemas/FileEntry'}}}}, '409': {$ref: '#/components/responses/Error'}, '413': {$ref: '#/components/responses/Error'}}}
  /api/agents/{id}/files/batch:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post: {operationId: batchAgentFileOperation, tags: [Files], requestBody: {$ref: '#/components/requestBodies/FileBatch'}, responses: {'200': {description: Per-path outcome, content: {application/json: {schema: {$ref: '#/components/schemas/FileBatchResult'}}}}, '400': {$ref: '#/components/responses/Error'}}}
  /api/agents/{agentId}/secrets:
    parameters: [{$ref: '#/components/parameters/AgentID'}]
    get: {operationId: listAgentSecrets, tags: [Secrets], responses: {'200': {description: Secret names, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentSecret'}}}}}, '403': {$ref: '#/components/responses/Error'}}}
  /api/agents/{agentId}/secrets/{name}:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/SecretName'}]
    put: {operationId: writeAgentSecret, tags: [Secrets], requestBody: {$ref: '#/components/requestBodies/AgentSecret'}, responses: {'200': {description: Secret, content: {application/json: {schema: {$ref: '#/components/schemas/AgentSecret'}}}}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteAgentSecret, tags: [Secrets], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/agents/{agentId}/tasks:
    parameters: [{$ref: '#/components/parameters/AgentID'}]
    get: {operationId: listAgentTasks, tags: [Tasks], responses: {'200': {description: Tasks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentTask'}}}}}}}
    post: {operationId: createAgentTask, tags: [Tasks], requestBody: {$ref: '#/components/requestBodies/TaskCreate'}, responses: {'201': {description: Task, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTask'}}}}}}
  /api/agents/{agentId}/tasks/{taskId}:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/TaskID'}]
    patch: {operationId: updateAgentTask, tags: [Tasks], requestBody: {$ref: '#/components/requestBodies/TaskPatch'}, responses: {'200': {description: Task, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTask'}}}}}}
    delete: {operationId: deleteAgentTask, tags: [Tasks], responses: {'200': {$ref: '#/components/responses/JSONSuccess'}}}
  /api/agents/{agentId}/tasks/{taskId}/runs:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/TaskID'}]
    get: {operationId: listAgentTaskRuns, tags: [Tasks], responses: {'200': {description: Runs, content: {application/json: {schema: {type: array, items: {type: object, additionalProperties: true}}}}}}}
  /api/agents/{agentId}/tasks/{taskId}/run:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/TaskID'}]
    post: {operationId: runAgentTask, tags: [Tasks], responses: {'200': {description: Outcome, content: {application/json: {schema: {type: object, additionalProperties: true}}}}}}
  /api/agents/{agentId}/issues:
    parameters: [{$ref: '#/components/parameters/AgentID'}]
    get: {operationId: listIssues, tags: [Issues], description: The caller's own issues on this agent, most recently active first., responses: {'200': {description: Issues, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Issue'}}}}}, '404': {$ref: '#/components/responses/Error'}}}
    post: {operationId: createIssue, tags: [Issues], description: Opens the issue and starts the agent working on it in a session of its own., requestBody: {$ref: '#/components/requestBodies/IssueCreate'}, responses: {'201': {description: Issue, content: {application/json: {schema: {$ref: '#/components/schemas/Issue'}}}}, '400': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
  /api/agents/{agentId}/issues/{issueId}:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/IssueID'}]
    get: {operationId: getIssue, tags: [Issues], responses: {'200': {description: Issue, content: {application/json: {schema: {$ref: '#/components/schemas/Issue'}}}}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {operationId: updateIssue, tags: [Issues], description: Rename, resolve, or reopen. Resolving is refused while a run is in progress., requestBody: {$ref: '#/components/requestBodies/IssuePatch'}, responses: {'200': {description: Issue, content: {application/json: {schema: {$ref: '#/components/schemas/Issue'}}}}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
    delete: {operationId: deleteIssue, tags: [Issues], description: Deletes the issue and its session. Refused while a run is in progress., responses: {'200': {$ref: '#/components/responses/JSONSuccess'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}}
  /api/agents/{agentId}/issues/{issueId}/interrupt:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/IssueID'}]
    post: {operationId: interruptIssue, tags: [Issues], description: Stops the current run. The issue stays open for a reply., responses: {'200': {description: Issue, content: {application/json: {schema: {$ref: '#/components/schemas/Issue'}}}}, '404': {$ref: '#/components/responses/Error'}}}
  /api/agents/{agentId}/issues/{issueId}/cancel:
    parameters: [{$ref: '#/components/parameters/AgentID'}, {$ref: '#/components/parameters/IssueID'}]
    post: {operationId: cancelIssue, tags: [Issues], description: Stops any run and closes the issue as cancelled., responses: {'200': {description: Issue, content: {application/json: {schema: {$ref: '#/components/schemas/Issue'}}}}, '404': {$ref: '#/components/responses/Error'}}}
components:
  securitySchemes:
    carmelSession: {type: apiKey, in: cookie, name: carmel_session}
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    AgentID: {name: agentId, in: path, required: true, schema: {type: string}}
    RunID: {name: runId, in: path, required: true, schema: {type: string}}
    TaskID: {name: taskId, in: path, required: true, schema: {type: string}}
    IssueID: {name: issueId, in: path, required: true, schema: {type: string}}
    SecretName: {name: name, in: path, required: true, schema: {type: string}}
    EntryID: {name: entryId, in: path, required: true, schema: {type: string}}
    AttachmentID: {name: attachmentId, in: path, required: true, schema: {type: string}}
    ImageIndex: {name: imageIndex, in: path, required: true, schema: {type: integer, minimum: 0}}
    PartIndex: {name: partIndex, in: path, required: true, schema: {type: integer, minimum: 0}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    JSONSuccess: {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/OK'}}}}
    ActiveRunConflict: {description: Resource is busy, headers: {x-agent-run-id: {schema: {type: string}}}, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Error'}, {type: object, properties: {runId: {type: string}}}]}}}}
    SafeEntryConflict: {description: Invalid cut point, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Error'}, {type: object, properties: {safeEntryId: {type: string}}}]}}}}
    NDJSON: {description: Live sequence-enveloped run events, headers: {x-agent-run-id: {schema: {type: string}}, x-agent-event-cursor: {schema: {type: integer}}}, content: {application/x-ndjson: {schema: {type: string, format: binary}}}}
    Download: {description: File bytes or a zip archive, headers: {content-disposition: {schema: {type: string}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}, application/zip: {schema: {type: string, format: binary}}}}
    Image: {description: Binary image, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}, image/webp: {schema: {type: string, format: binary}}}}
  requestBodies:
    Login: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
    Setup: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SetupRequest'}}}}
    Account: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountRequest'}}}}
    CreateUser: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateUserRequest'}}}}
    UserProfile: {required: true, content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}, fastTaskModelRefId: {type: string}}}}}}
    UserRole: {required: true, content: {application/json: {schema: {type: object, required: [role], properties: {role: {type: string, enum: [admin, user]}}}}}}
