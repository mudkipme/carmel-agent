packages:
  - "packages/*"

# Pinned upstream SDKs still request vulnerable older transitive versions.
# Keep these patches until their dependency ranges include the fixed releases.
overrides:
  "esbuild@<0.24.3": "^0.25.12"
  "hono@<4.13.7": "^4.13.13"
  "@hono/node-server@<1.19.15": "^1.19.15"
  "ip-address@<10.7.1": "^10.7.1"
  "qs@<6.16.0": "^6.16.0"
  "proxy-addr@<2.0.8": "^2.0.8"
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
  "shell-quote@<1.11.0": "^1.11.0"
  "follow-redirects@>=1.16.0 <1.16.2": "^1.16.2"

onlyBuiltDependencies:
  - better-sqlite3

blockExoticSubdeps: false

allowBuilds:
  "@google/genai": true
  better-sqlite3: true
  esbuild: true
  koffi: true
  msw: true
  protobufjs: true

minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.5.0"
  - "@earendil-works/pi-agent-core@1.5.0"
  - "@earendil-works/pi-ai@1.5.0"
  - "@earendil-works/pi-coding-agent@1.5.0"
  - "@earendil-works/pi-telemetry@1.5.0"
  - "@earendil-works/pi-tui@1.5.0"
  - "@earendil-works/pi-codemode@1.5.0"
  - "@earendil-works/pi-mcp@1.5.0"
  - "@earendil-works/pi-durable@1.5.0"
  - "@earendil-works/pi-schema@1.5.0"
