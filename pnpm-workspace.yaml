packages:
  - "packages/*"

# Versions shared across packages. Pi packages must move together.
catalog:
  "@earendil-works/chord": 1.5.2
  "@earendil-works/pi-agent-core": 1.5.2
  "@earendil-works/pi-ai": 1.5.2
  "@earendil-works/pi-codemode": 1.5.2
  "@earendil-works/pi-coding-agent": 1.5.2
  "@earendil-works/pi-durable": 1.5.2
  "@earendil-works/pi-mcp": 1.5.2
  "@earendil-works/pi-schema": 1.5.2
  "@types/node": ^26.6.6
  tsx: ^4.23.15
  typescript: ^7.0.2
  zod: ^4.6.7

# drizzle-kit's @esbuild-kit/core-utils still pins a vulnerable esbuild range.
# Keep this patch until its dependency range includes the fixed release.
overrides:
  "esbuild@<0.24.3": "^0.25.12"
  "ip-address@<10.7.4": "^10.7.4"

blockExoticSubdeps: false

allowBuilds:
  "@google/genai": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - "@earendil-works/chord@1.5.0"
  - "@earendil-works/pi-agent-core@1.5.0"
  - "@earendil-works/pi-ai@1.5.0"
  - "@earendil-works/pi-coding-agent@1.5.0"
  - "@earendil-works/pi-telemetry@1.5.0"
  - "@earendil-works/pi-tui@1.5.0"
  - "@earendil-works/pi-codemode@1.5.0"
  - "@earendil-works/pi-mcp@1.5.0"
  - "@earendil-works/pi-durable@1.5.0"
  - "@earendil-works/pi-schema@1.5.0"
